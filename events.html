<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0a10">
<title>Tournaments &amp; Events — J's Pickle Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="events">

<div id="toastWrap" class="toast-wrap"></div>
<div id="siteHeader"></div>

<main class="page-wrap">
  <div class="page-head">
    <h1>Tournaments &amp; Events</h1>
    <p class="muted">Open plays, clinics, and monthly tournaments at the Yard — check what's coming up.</p>
  </div>

  <!-- Admin-only: create/edit event (hidden for members) -->
  <div class="card hidden" id="eventFormCard">
    <h3 id="eventFormTitle">Post an event</h3>
    <form id="eventForm">
      <div class="grid-2" style="margin-bottom:0">
        <label>Event title
          <input type="text" id="evTitle" maxlength="80" required placeholder="Monthly Doubles Tournament">
        </label>
        <label>Date
          <input type="date" id="evDate" required>
        </label>
      </div>
      <label>Time / schedule <span class="muted small">(optional)</span>
        <input type="text" id="evTime" maxlength="60" placeholder="8:00 AM – 5:00 PM">
      </label>
      <label>Details
        <textarea id="evDesc" rows="4" maxlength="1500" required placeholder="Format, divisions, entry fee, prizes, how to register…"></textarea>
      </label>
      <label>Photos <span class="photo-count">(<span id="photoCount">0</span>/5 · JPG or PNG, auto-compressed)</span>
        <input type="file" id="evPhotos" accept="image/*" multiple>
      </label>
      <div class="upload-previews" id="uploadPreviews"></div>
      <div class="row gap">
        <button class="btn primary" type="submit" id="evSubmit">Post Event</button>
        <button class="btn ghost hidden" type="button" id="evCancelEdit">Cancel Edit</button>
      </div>
    </form>
  </div>

  <div id="eventList" class="event-list" style="margin-top:1rem"></div>
</main>

<div id="siteFooter"></div>

<script src="js/db.js"></script>
<script src="js/shell.js"></script>
<script src="js/events.js"></script>
</body>
</html>
